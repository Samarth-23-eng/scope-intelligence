services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: osint
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: osintdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osint -d osintdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  tor:
    build:
      context: .
      dockerfile: Dockerfile.tor
    profiles: ["deep-research"]
    volumes:
      - tor_data:/var/lib/tor
    healthcheck:
      test: ["CMD-SHELL", "test -S /var/run/tor/socks || test -f /var/lib/tor/state"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build: .
    env_file: .env
    environment:
      POSTGRES_URL: postgresql://osint:${POSTGRES_PASSWORD}@postgres:5432/osintdb
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      RUNNING_IN_DOCKER: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      TOR_SOCKS_PROXY_URL: ${TOR_SOCKS_PROXY_URL:-socks5h://tor:9050}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - model_cache:/app/.cache
      - llm_secrets:/app/.secrets
      - reports_data:/app/reports/generated
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  dashboard:
    build:
      context: ./dashboard
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  model_cache:
  llm_secrets:
  reports_data:
  tor_data:
