name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Remove credentials, cookies, personal information, private target data, tunnel URLs, and internal hostnames from everything you submit.
  - type: checkboxes
    attributes:
      label: Safety check
      options:
        - label: I removed secrets and private investigation data from this report.
          required: true
        - label: I searched existing issues for the same problem.
          required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Dashboard
        - API
        - Collection or crawler
        - AI agent or model gateway
        - Relationship intelligence
        - Database or migration
        - Reports or alerts
        - Docker or installation
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest safe sequence that reproduces the problem.
      placeholder: |
        1. Start the stack with ...
        2. Open ...
        3. Run ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows 11, Docker Desktop 4.x, Chrome 140
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Paste only the relevant lines after removing sensitive values.
      render: shell
