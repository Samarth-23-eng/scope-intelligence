<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
  <title id="title">Scope Intelligence</title>
  <desc id="desc">Evidence-first company intelligence with collection, relationship mapping, and AI analysis.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b11"/>
      <stop offset="0.55" stop-color="#0d1420"/>
      <stop offset="1" stop-color="#07110f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fa8ef"/>
      <stop offset="1" stop-color="#55d3b2"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#578ee8" stop-opacity=".25"/>
      <stop offset="1" stop-color="#578ee8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0v42" fill="none" stroke="#91a0b8" stroke-opacity=".055"/>
    </pattern>
    <filter id="soft">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1440" height="520" rx="28" fill="url(#bg)"/>
  <rect width="1440" height="520" rx="28" fill="url(#grid)"/>
  <circle cx="1150" cy="170" r="300" fill="url(#glow)" filter="url(#soft)"/>
  <circle cx="220" cy="470" r="240" fill="#28b893" opacity=".055" filter="url(#soft)"/>

  <g opacity=".72" stroke-linecap="round">
    <path d="M980 114L1128 80 1282 146 1196 258 1026 250 916 348 1098 418 1302 358" fill="none" stroke="#5279b5" stroke-width="2"/>
    <path d="M1128 80L1196 258 1302 358M980 114L1026 250 1098 418M1282 146L1026 250" fill="none" stroke="#44b99d" stroke-opacity=".54"/>
    <g fill="#0b111a" stroke-width="3">
      <circle cx="980" cy="114" r="12" stroke="#7fa8ef"/>
      <circle cx="1128" cy="80" r="9" stroke="#55d3b2"/>
      <circle cx="1282" cy="146" r="13" stroke="#8b7cf6"/>
      <circle cx="1196" cy="258" r="22" stroke="url(#accent)"/>
      <circle cx="1026" cy="250" r="10" stroke="#55d3b2"/>
      <circle cx="916" cy="348" r="13" stroke="#8b7cf6"/>
      <circle cx="1098" cy="418" r="10" stroke="#7fa8ef"/>
      <circle cx="1302" cy="358" r="15" stroke="#55d3b2"/>
    </g>
    <g fill="#aebbd0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1">
      <text x="1228" y="263">EVIDENCE</text>
      <text x="1044" y="244">ENTITY</text>
      <text x="1120" y="447">SIGNAL</text>
    </g>
