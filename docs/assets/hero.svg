  <g transform="translate(92 82)">
    <rect width="54" height="54" rx="16" fill="#101a2a" stroke="#6999e8" stroke-opacity=".55"/>
    <circle cx="27" cy="27" r="13" fill="none" stroke="url(#accent)" stroke-width="3"/>
    <path d="M27 8v8M27 38v8M8 27h8M38 27h8" stroke="#8fb7f6" stroke-width="2" stroke-linecap="round"/>
  </g>

  <text x="92" y="202" fill="#8295b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" letter-spacing="5">OPEN-SOURCE INTELLIGENCE WORKSPACE</text>
  <text x="88" y="292" fill="#f1f4f8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="76" font-weight="600" letter-spacing="-4">Scope Intelligence</text>
  <text x="94" y="348" fill="#9aa8bb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24">Collect deeply. Reason carefully. Keep the evidence.</text>

  <g transform="translate(94 394)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" letter-spacing="1">
